[project]
name = "integrity-check"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pymupdf", "python-docx", "reportlab", "faster-whisper", "av",
  "sentence-transformers", "faiss-cpu", "transformers", "torch",
  "numpy", "gTTS", "imageio-ffmpeg", "pytest",
]

[project.scripts]
integrity-check = "run_integrity_check:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["integrity"]
py-modules = ["run_integrity_check", "build_dataset", "evaluate"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
